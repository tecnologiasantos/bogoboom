# Local stack: docker compose --env-file ../.env -f compose.yml up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes: [dbdata:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  migrate:
    build: ../backend
    entrypoint: ["/app/migrate"]
    environment: &dbenv
      DB_HOST: db
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
    depends_on: { db: { condition: service_healthy } }

  api:
    build: ../backend
    environment:
      <<: *dbenv
      APP_ENV: ${APP_ENV:-development}
      FRONTEND_URL: ${FRONTEND_URL}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:?set in .env}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:?set in .env}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    ports: ["127.0.0.1:8080:8080"]
    depends_on: { migrate: { condition: service_completed_successfully } }

  web:
    build: ../frontend/bogoboom-frontend
    ports: ["127.0.0.1:4200:8080"]
    depends_on: [api]

volumes:
  dbdata:
