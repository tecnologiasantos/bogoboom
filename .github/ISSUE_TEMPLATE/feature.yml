name: Feature / idea
description: Propose a feature or improvement
labels: ["type:feature"]
body:
  - type: dropdown
    id: persona
    attributes: { label: Persona, options: [Newcomer, HR, Agency, Admin, All] }
    validations: { required: true }
  - type: textarea
    id: story
    attributes:
      label: User story
      placeholder: As a <persona> I want <goal> so that <benefit>
    validations: { required: true }
  - type: textarea
    id: ac
    attributes: { label: Acceptance criteria, placeholder: "- [ ] ..." }
    validations: { required: true }
  - type: textarea
    id: notes
    attributes: { label: Notes / mockups / links }
