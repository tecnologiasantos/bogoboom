name: CI
on:
  push: { branches: [main, rewrite-go-angular] }
  pull_request:
permissions: { contents: read }
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: ci, POSTGRES_DB: bogoboom_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: ci
      DB_NAME: bogoboom_test
      DB_SSLMODE: disable
      BOGOBOOM_TEST_DB: postgres://postgres:ci@127.0.0.1:5432/bogoboom_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: backend/go.mod, cache-dependency-path: backend/go.sum }
      - name: Build
        run: ../.github/scripts/annotate.sh "go build" go build ./...
      - name: Vet
        run: ../.github/scripts/annotate.sh "go vet" go vet ./...
      - name: Format
        run: |
          bad="$(gofmt -l .)"
          if [ -n "$bad" ]; then echo "$bad" | sed 's/^/::error::gofmt needed for /'; exit 1; fi
      - name: Migrate
        run: ../.github/scripts/annotate.sh "migrate" go run ./cmd/migrate
      - name: Test (race, with PostgreSQL)
        run: ../.github/scripts/annotate.sh "go test" go test -race -count=1 ./...
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend/bogoboom-frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/bogoboom-frontend/package-lock.json }
      - run: npm ci
      - run: npm run build
      - name: Unit tests
        run: npm test -- --watch=false
      - name: Dependency audit (non-blocking)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
