  <title>Bogoboom | Partner With Us</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f5f5f5;

<body>

  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KB35HQ9P"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->

  <header>
    <h1>Partner With Us</h1>
    <p>Join Bogoboom’s network of innovators and collaborators</p>
  </header>

  <div class="container">
    <h2>Bogoboom Partnership Form</h2>
    <form id="partnershipForm" action="/backend/profiles/partner_inquiry.php" method="POST" autocomplete="on">
      <div style="display: none;">
        <label for="website">Leave this field empty:</label>
        <input type="text" name="website" id="website" tabindex="-1" autocomplete="off" />
      </div>
      <div class="form-group">
        <label for="fullName">Full Name:</label>
        <input type="text" id="fullName" name="fullName" required />
      </div>
      <div class="form-group">
        <label for="emailAddress">Email Address:</label>
        <input type="email" id="emailAddress" name="emailAddress" required />
      </div>
      <div class="form-group">
        <label for="phoneNumber">Phone Number:</label>
        <input type="tel" id="phoneNumber" name="phoneNumber" />
      </div>
      <div class="form-group">
        <label for="country">Country:</label>
        <select id="country" name="country" required>
          <option value="">Loading countries...</option>
        </select>
      </div>
      <div class="form-group" id="stateOrDepartmentGroup" style="display: none;">
        <label for="stateOrDepartment" id="stateOrDepartmentLabel">State/Department:</label>
        <select id="stateOrDepartment" name="stateOrDepartment"></select>
      </div>
      <div class="form-group">
        <label for="city">City:</label>
        <select id="city" name="city" required>
          <option value="">Select a state/department first</option>
        </select>
      </div>
      <div class="form-group">
        <label for="collaborationType">How would you like to collaborate?</label>
        <select id="collaborationType" name="collaborationType" required>
          <option value="">Select an option</option>
          <option value="Real Estate Partner">Real Estate Partner</option>
          <option value="Hiring Company Partner">Hiring Company Partner</option>
          <option value="Associate Brand">Associate Brand</option>
        </select>
      </div>
      <button type="submit">Submit Inquiry</button>
    </form>
  </div>

  <div class="footer">
    <p>&copy; 2025 Bogoboom. All rights reserved. | 
      <a href="https://bogoboom.com/privacy_policy.html">Privacy Policy</a>
    </p>
  </div>

  <!-- Dynamic Country/State/City Script -->
  <script>
    $(document).ready(function () {
      function loadCountries() {
        $.get("https://countriesnow.space/api/v0.1/countries/iso", function (data) {
          if (data && data.data) {
            const options = data.data.map(c =>
              `<option value="${c.name}" data-iso2="${c.Iso2}">${c.name}</option>`
            );
            $("#country").html('<option value="">Select a country</option>' + options.join(''));
          } else {
            $("#country").html('<option value="">Failed to load countries</option>');
          }
        }).fail(function () {
          $("#country").html('<option value="">Error fetching countries</option>');
        });
      }

      loadCountries();

      $("#country").on("change", function () {
        const country = $(this).val();
        const iso2 = $(this).find("option:selected").data("iso2");

        $("#stateOrDepartment").empty();
        $("#city").empty().append('<option value="">Select a state first</option>');
        $("#stateOrDepartmentGroup").hide();

        if (!country || !iso2) return;

        const label = (country === "Colombia") ? "Department" : "State";
        $("#stateOrDepartmentLabel").text(label + ":");

        $.ajax({
          type: "POST",
          url: "https://countriesnow.space/api/v0.1/countries/states",
          contentType: "application/json",
          data: JSON.stringify({ iso2 }),
          success: function (res) {
            if (res.data && res.data.states.length > 0) {
              const options = res.data.states.map(s => `<option value="${s.name}">${s.name}</option>`);
              $("#stateOrDepartment").html('<option value="">Select a ' + label.toLowerCase() + '</option>' + options.join(''));
              $("#stateOrDepartmentGroup").show();
            } else {
              fetchCitiesByCountry(country);
            }
          },
          error: function () {
            fetchCitiesByCountry(country);
          }
        });
      });

      $("#stateOrDepartment").on("change", function () {
        const state = $(this).val();
        const country = $("#country").val();
        if (state) {
          fetchCitiesByState(country, state);
        }
      });

      function fetchCitiesByState(country, state) {
        $.ajax({
          type: "POST",
          url: "https://countriesnow.space/api/v0.1/countries/state/cities",
          contentType: "application/json",
          data: JSON.stringify({ country, state }),
          success: function (res) {
            if (res.data && res.data.length > 0) {
              const cities = res.data.map(c => `<option value="${c}">${c}</option>`);
              $("#city").html('<option value="">Select a city</option>' + cities.join(''));
            } else {
              $("#city").html('<option value="">No cities found</option>');
            }
          },
          error: function () {
            $("#city").html('<option value="">Failed to load cities</option>');
          }
        });
      }

      function fetchCitiesByCountry(country) {
        $.ajax({
          type: "POST",
          url: "https://countriesnow.space/api/v0.1/countries/cities",
          contentType: "application/json",
          data: JSON.stringify({ country }),
          success: function (res) {
            if (res.data && res.data.length > 0) {
              const cities = res.data.map(c => `<option value="${c}">${c}</option>`);
              $("#city").html('<option value="">Select a city</option>' + cities.join(''));
            } else {
              $("#city").html('<option value="">No cities found</option>');
            }
          },
          error: function () {
            $("#city").html('<option value="">Error loading cities</option>');
          }
        });
      }
    });
  </script>

  <!-- ✅ Safe dataLayer push -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const form = document.getElementById("partnershipForm");
      if (!form) return;

      form.addEventListener("submit", function (e) {
        if (!form.checkValidity()) return;

        window.dataLayer = window.dataLayer || [];
        dataLayer.push({
          event: "partnershipFormSubmit",
          fullName: document.getElementById("fullName").value,
          email: document.getElementById("emailAddress").value,
          phone: document.getElementById("phoneNumber").value,
          country: document.getElementById("country").value,
          state: document.getElementById("stateOrDepartment")?.value || null,
          city: document.getElementById("city").value,
          collaborationType: document.getElementById("collaborationType").value,
          timestamp: new Date().toISOString(),
          utmSource: new URLSearchParams(window.location.search).get("utm_source") || null,
          utmMedium: new URLSearchParams(window.location.search).get("utm_medium") || null,
          utmCampaign: new URLSearchParams(window.location.search).get("utm_campaign") || null
        });
      });
    });
  </script>
</body>
