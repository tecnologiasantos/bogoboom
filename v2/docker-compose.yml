services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: bogoboom, POSTGRES_PASSWORD: bogoboom, POSTGRES_DB: bogoboom }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL","pg_isready -U bogoboom"], interval: 5s, retries: 10 }
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      DATABASE_URL: postgres://bogoboom:bogoboom@db:5432/bogoboom
      AUTH_MODE: dev
      JWT_SECRET: change-me-in-dev-only-change-me-in-dev-only
      CORS_ORIGIN: http://localhost:3000
    ports: ["4000:4000"]
    depends_on: { db: { condition: service_healthy } }
volumes: { pgdata: {} }
