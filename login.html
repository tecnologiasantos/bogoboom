<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bogoboom | Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f5f5f5;
    }
    /* Logo styles */
    .image-container,
    .image-container-right {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      z-index: 10;
    }
    .image-container {
      left: 10px;
    }
    .image-container-right {
      right: 10px;
    }
    .image-container img,
    .image-container-right img {
      width: 360px;
      height: auto;
    }

    @media (max-width: 1024px) {
      .image-container,
      .image-container-right {
        display: none;
      }
    }

    header {
      background-color: #004a8f;
      color: white;
      padding: 1rem 2rem;
      text-align: center;
    }
    main {
      padding: 2rem;
      text-align: center;
    }
    .intro {
      max-width: 600px;
      margin: 0 auto 2rem;
      font-size: 1.2rem;
    }
    section {
      max-width: 700px;
      margin: 2rem auto;
      text-align: left;
      background: #fff;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    section h3 {
      color: #004a8f;
      margin-bottom: 1rem;
    }
    section form {
      display: grid;
      gap: 1rem;
      max-width: 600px;
      margin: 0 auto;
    }
    section form div {
      margin-bottom: 1.5rem;
    }
    label {
      font-weight: bold;
      color: #004a8f;
    }
    input, button {
      width: 100%;
      padding: 0.8rem;
      border-radius: 6px;
      font-size: 1rem;
      border: 1px solid #ddd;
      box-sizing: border-box;
    }
    input[type="text"], input[type="email"], input[type="password"] {
      background-color: #f9f9f9;
    }
    button {
      background-color: #004a8f;
      color: white;
      font-size: 1.1rem;
      border: none;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    button:hover {
      background-color: #003c6e;
    }
    footer {
      margin-top: 2rem;
      text-align: center;
      font-size: 0.9rem;
      color: #666;
    }
  </style>
</head>
<body>

  <!-- Logo containers -->
  <div class="image-container">
    <img src="https://tecnologiasantos-mira.s3.sa-east-1.amazonaws.com/mira/MIRA-powered.png" alt="MIRA Project Logo">
  </div>

  <div class="image-container-right">
    <img src="https://tecnologiasantos-mira.s3.sa-east-1.amazonaws.com/mira/logo-print-hd.jpg" alt="MIRA Project Logo Right">
  </div>

  <header>
    <h1>Welcome to Bogoboom</h1>
    <p>Connecting newcomers in Bogotá with jobs and homes</p>
  </header>

  <main>
    <div class="intro">
      <p>Bogoboom is your bridge to a smooth landing in Bogotá. Whether you're a newcomer, an HR department, or a real estate agency, our platform helps you connect and thrive.</p>
    </div>

    <!-- Login Section -->
    <section>
      <h3>Login</h3>
      <form action="/backend/profiles/login.php" method="POST">
        <input type="hidden" name="action" value="login">
        <div>
          <label for="login-email">📧 Email:</label>
          <input type="email" id="login-email" name="email" required>
        </div>
        <div>
          <label for="login-password">🔒 Password:</label>
          <input type="password" id="login-password" name="password" required>
        </div>
        <div style="text-align: center;">
          <button type="submit">🔑 Login</button>
        </div>
      </form>
    </section>

  </main>

  <footer>
    &copy; 2025 Bogoboom. All rights reserved.
  </footer>

  <script src="/csrf.js" defer></script>
</body>
</html>
